[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "excel-mcp-rw"
version = "1.0.0"
description = "High-Performance Excel MCP Server powered by Pandas, OpenPyXL, and Native Windows Microsoft Excel automation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Indala" }
]
keywords = ["mcp", "excel", "model-context-protocol", "spreadsheet", "pandas", "pywin32", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]

dependencies = [
    "mcp>=1.2.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlsxwriter>=3.1.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.scripts]
excel-mcp = "excel_mcp.server:main"

[project.urls]
Homepage = "https://github.com/indala/excel-mcp-rw"
Repository = "https://github.com/indala/excel-mcp-rw.git"
Issues = "https://github.com/indala/excel-mcp-rw/issues"
